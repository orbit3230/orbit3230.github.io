# Setup
title: 저장소
description: 학부 과정에서 공부한 것들을 정리해 올리는 개인 블로그.
url: https://orbit3230.github.io
avatar: /avatar.png
paginate: 5
permalink: pretty

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - .sass-cache
  - .vs
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/

# Optimize Jekyl SEO Tag
logo: logo.png
social:
  name: Kim SeongHyeon
  links:
    - https://github.com/orbit3230
google_site_verification: xxxxx
lang: ko

sass:
  style: compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: 김성현
  url: https://github.com/orbit3230
  email: hu0868@naver.com

future: true  

# Optional media sidebar. Shared links can be pasted by each visitor.
media:
  enabled: true
  video_url: ""
  music_url: ""

# Public GitHub Issues store one discussion per post URL.
comments:
  enabled: true
  repo: orbit3230/orbit3230.github.io
