{% if site.comments.enabled and site.comments.api_url != '' %}
<div class="community-panel" data-community-panel data-endpoint="{{ site.comments.api_url | escape }}" data-index="{{ '/post-index.json' | relative_url }}">
  <section class="activity-widget" aria-labelledby="activity-title">
    <div class="community-heading"><h2 id="activity-title">최근 대화가 있는 글</h2><button type="button" data-activity-refresh aria-label="최근 대화 새로고침">↻</button></div>
    <p class="community-status" data-activity-status role="status">댓글·답글이 달린 글을 불러오는 중…</p>
    <ol class="activity-list" data-activity-list></ol>
    <nav class="community-pager" aria-label="최근 대화 페이지"><button type="button" data-activity-prev disabled>이전</button><span data-activity-page>1 페이지</span><button type="button" data-activity-next disabled>다음</button></nav>
  </section>
  <details class="inbox-widget" data-inbox>
    <summary>내 답글 알림 <span class="inbox-badge" data-inbox-badge>0</span></summary>
    <p class="community-help">이 브라우저에서 작성한 최근 200개 댓글의 답글을 확인합니다. 브라우저 데이터를 지우거나 다른 기기에서는 연결되지 않습니다.</p>
    <div class="inbox-actions"><button type="button" data-inbox-refresh>새로고침</button><button type="button" data-inbox-read>모두 읽음</button></div>
    <p class="community-status" data-inbox-status role="status">이 브라우저에서 작성한 댓글이 없습니다.</p>
    <ol class="inbox-list" data-inbox-list></ol>
    <button type="button" data-inbox-more hidden>알림 더 보기</button>
  </details>
</div>
{% endif %}
