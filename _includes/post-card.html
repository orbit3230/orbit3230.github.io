{% assign post = include.post %}
<article class="post-entry"{% if include.filterable %} data-post data-title="{{ post.title | escape }}" data-year="{{ post.date | date: '%Y' }}" data-tags="{{ post.tags | jsonify | escape }}" data-categories="{{ post.categories | jsonify | escape }}"{% endif %}>
  <div class="entry-meta"><a href="{{ '/dates/' | relative_url }}#{{ post.date | date: '%Y' }}"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time></a><span class="meta-line"></span>{% for tag in post.tags limit:2 %}<a class="entry-tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify | uri_escape }}">{{ tag | escape }}</a>{% endfor %}</div>
  <h2 class="post-title"><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
  <p class="entry-excerpt">{{ post.excerpt | strip_html | normalize_whitespace | truncate: 170 | escape }}</p>
  <a class="entry-arrow" href="{{ post.url | relative_url }}" aria-label="{{ post.title | escape }} 읽기">{% include icon.html name='arrow' %}</a>
</article>
