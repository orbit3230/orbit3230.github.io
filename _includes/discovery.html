<dialog class="discovery-dialog" id="quick-search" aria-labelledby="quick-search-title" data-pagefind-url="{{ '/pagefind/pagefind.js' | relative_url }}" data-search-url="{{ '/search.json' | relative_url }}" data-tags-url="{{ '/tags/' | relative_url }}">
  <div class="dialog-top"><h2 id="quick-search-title">빠른 검색</h2><button type="button" data-dialog-close aria-label="검색 닫기">닫기 <kbd>Esc</kbd></button></div>
  <label class="visually-hidden" for="quick-query">글 제목, 태그 또는 본문 검색</label>
  <input id="quick-query" type="search" placeholder="글 제목, 태그 또는 본문 검색" autocomplete="off">
  <div class="search-filters">
    <label>연도 <select data-search-year aria-label="검색 연도"><option value="">모든 연도</option>{% assign years = site.posts | group_by_exp: 'post', "post.date | date: '%Y'" %}{% for year in years %}<option value="{{ year.name }}">{{ year.name }}</option>{% endfor %}</select></label>
    <label>태그 <select data-search-tag aria-label="검색 태그"><option value="">모든 태그</option>{% assign sorted_tags = site.tags | sort %}{% for tag in sorted_tags %}<option value="{{ tag[0] | escape }}">{{ tag[0] | escape }}</option>{% endfor %}</select></label>
    <button type="button" data-search-reset>초기화</button>
  </div>
  <p class="discovery-status" role="status" data-search-status>검색어를 입력하세요.</p>
  <div class="quick-tags" aria-label="일치하는 태그"></div>
  <ul class="quick-results" aria-label="검색 결과"></ul>
  <nav class="search-pagination" aria-label="검색 결과 페이지" hidden><button type="button" data-search-prev>이전</button><span data-search-page></span><button type="button" data-search-next>다음</button></nav>
  <p class="dialog-help">Tab으로 결과 이동 · Enter로 열기 · Esc로 닫기</p>
</dialog>
<dialog class="discovery-dialog preview-dialog" id="post-preview-dialog" aria-labelledby="preview-title">
  <div class="dialog-top"><span class="eyebrow">POST PREVIEW</span><button type="button" data-dialog-close aria-label="미리보기 닫기">닫기 <kbd>Esc</kbd></button></div>
  <h2 id="preview-title"></h2><p data-preview-summary></p>
  <div class="search-filters">
    <label>연도 <select data-search-year aria-label="검색 연도"><option value="">모든 연도</option>{% assign years = site.posts | group_by_exp: 'post', "post.date | date: '%Y'" %}{% for year in years %}<option value="{{ year.name }}">{{ year.name }}</option>{% endfor %}</select></label>
    <label>태그 <select data-search-tag aria-label="검색 태그"><option value="">모든 태그</option>{% assign sorted_tags = site.tags | sort %}{% for tag in sorted_tags %}<option value="{{ tag[0] | escape }}">{{ tag[0] | escape }}</option>{% endfor %}</select></label>
    <button type="button" data-search-reset>초기화</button>
  </div>
  <p class="discovery-status" role="status" data-preview-status></p>
  <nav class="preview-outline" aria-label="미리보기 목차"><ol></ol></nav>
  <a class="preview-read" href="#">글 전체 읽기 →</a>
</dialog>
