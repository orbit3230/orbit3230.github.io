{% if site.comments.enabled and page.comments != false %}
<section class="comments-section" id="comments" data-comments data-repo="{{ site.comments.repo | escape }}" data-post-path="{{ page.url | escape }}" data-post-title="{{ page.title | escape }}" data-post-url="{{ page.url | absolute_url | escape }}" aria-labelledby="comments-title">
  <div class="section-heading"><h2 id="comments-title">댓글과 의견</h2><span>GitHub 계정으로 참여</span></div>
  <p class="comments-intro">질문이나 다른 생각을 남겨 주세요. 작성은 GitHub에서, 대화는 이곳에서도 확인할 수 있습니다.</p>
  <div class="comments-actions"><button type="button" data-comments-load>댓글 불러오기</button><a data-comments-write href="https://github.com/{{ site.comments.repo | escape }}/issues" target="_blank" rel="noopener noreferrer">GitHub에서 대화 찾기 ↗</a></div>
  <p class="comments-status" data-comments-status role="status">댓글 불러오기를 누르면 이 글의 공개 대화를 조회합니다.</p>
  <div class="comment-list" data-comment-list></div>
  <button type="button" class="comments-more" data-comments-more hidden>댓글 더 보기</button>
  <noscript><p>GitHub에서 의견을 남기거나 확인할 수 있습니다.</p></noscript>
</section>
{% endif %}
